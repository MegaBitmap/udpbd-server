name: CI

on:
  push:
    branches:
      - 'windows'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]


jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: git mingw-w64-ucrt-x86_64-gcc make p7zip

    - name: Compile project
      run: |
        make clean all
        7z a -t7z ${{ github.event.repository.name }}-w64.7z README.md "${{ github.event.repository.name }}*"

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}
        path: |
          ${{ github.event.repository.name }}-w64.7z

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:


    - uses: actions/checkout@v5
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Download all artifacts
      uses: actions/download-artifact@v5

    - name: list
      run: |
        ls -R

    - name: Create release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "windows"
        title: "Latest automated build"
        files: |
               ${{ github.event.repository.name }}*.7z
